<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://cyclo.codexfit.com/autoconfigure.js"></script>
    <link href="./styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/demo.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/codexSettings.js"></script>
</head>
<body>
    <div id="header"></div>

    <div id="content" class="markdown-body" data-markdown="./content/instructors.md">
        <!-- Page specific content will be here -->
    </div>
    
    <div data-codex>
        <codex-component :has-context="true" group="instructors" :fix-values="" :default-values="" type="codex-instructors"></codex-component>
        
        <!-- <codex-filter-context v-slot="{ filters, fixedValues }">
            <codex-instructors></codex-instructors>
        </codex-filter-context> -->
    </div>

    <script src="./js/loadComponents.js"></script>
    <script>
        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initComponents();
            await loadMarkdownContent();
        });
    </script>
</body>
</html>
