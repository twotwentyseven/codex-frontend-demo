<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://filament-testing.codexfit.com/autoconfigure.js"></script>
    <link href="./styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/demo.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/codexSettings.js"></script>
</head>
<body>
    <div id="header"></div>

    <div id="content" class="markdown-body" data-markdown="./content/timetable.md">
        <!-- Page specific content will be here -->
    </div>
    
    <!-- <div data-codex>
        <codex-component :has-context="true" group="timetable" type="codex-timetable"></codex-component>
    </div> -->

    <div data-codex>
        <codex-component :has-context="true" group="timetable" type="codex-timetable" :fixed-values="{'location': [3] }">
            <template #primary-filters="{ group, filters, fixedValues }">
                    <codex-contextual-filter :label="$t('filter.studio')" :filters="{'location_id': [3] }" :placeholder="$t('filter.timetable_default_placeholder')" :group="group" definition="studios" filter-key="studio.handle" filter-type="multi-select" :enable-border="false" :primary-filter="true"></codex-contextual-filter>
                </template>

                <template #secondary-filters="{ group, filters, fixedValues }">
                    <codex-contextual-filter :label="$t('filter.studio')" :group="group" definition="studios" filter-key="studio.handle" filter-type="checkbox-group"></codex-contextual-filter>
                    <codex-contextual-filter :label="$t('filter.event_type')" :group="group" definition="eventTypes" filter-key="event_type.handle" filter-type="checkbox-group"></codex-contextual-filter>
                    <codex-contextual-filter :label="$t('filter.instructor')" :group="group" definition="instructors" filter-key="instructor.handle" filter-type="checkbox-group"></codex-contextual-filter>
                </template>
        </codex-component>
    </div>

    <div data-codex>
        <codex-component :has-context="true" group="instructors" :fixed-values="{'metafields': ['primary-location:3']}" :default-values="{ limit: 30, page: 1 }" type="codex-instructors"></codex-component>
     </div>

    <script src="./js/loadComponents.js"></script>
    <script>
        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initComponents();
            await loadMarkdownContent();
        });
    </script>
</body>
</html>
