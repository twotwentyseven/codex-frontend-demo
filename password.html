<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://filament-staging.codexfit.com/autoconfigure.js"></script>
    <link href="/styles/demo.css" rel="stylesheet" type="text/css">
    <link href="/styles/css-variables.css" rel="stylesheet" type="text/css"/>
<link href="/styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="/styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css" rel="stylesheet">
    
    <script>
        Codex().set(
    'auto_configure', {
        modals: {
            'codex-cart': {
                modalProps: { 
                    'v-slot': '{open}',
                    'x-position': 'right',
                    'y-position': 'bottom', 
                },
                props: {
                    'v-on:updated': 'open',
                    'v-on:close': 'close'
                }
            },
            'codex-login': {
                modalProps: { 
                    'v-slot': '{close}',
                    ':delay-close': 3000,
                },
                props: {
                    'v-on:close': 'close'
                }
            },
            'codex-register': {
                modalProps: { 
                    'v-slot': '{close}',
                    ':delay-close': 3000,
                },
                props: {
                    'v-on:close': 'close'
                }
            },
            'codex-password-recover': {
                modalProps: { 
                    'v-slot': '{close}',
                    ':delay-close': 3000,
                },
                props: {
                    'v-on:close': 'close'
                }
            },
            'codex-password-reset': {
                modalProps: { 
                    'v-slot': '{close}',
                    ':delay-close': 3000,
                    ':default-state':true,
                    
                },
                props: {
                    'v-on:close': 'close'
                }
            },
            'codex-verify-sms': {
                modalProps: { 
                    'v-slot': '{close}',
                    ':delay-close': 3000,
                    ':show-close-button': false
                },
                props: {
                    'v-on:close': 'close'
                }
            },
        }
    }
)
    </script>
</head>
<body>
    <div id="header-container"></div>

    <div id="content" class="markdown-body" data-markdown-content="/content/...">
        <!-- Page specific content will be here -->
    </div>

    <script type="module">
        import { initComponents } from '/js/loadComponents.js';
        
        // Function to load components
        async function loadComponents() {
            try {
                // Load header
                const headerResponse = await fetch('/components/header.html');
                const headerHtml = await headerResponse.text();
                document.getElementById('header-container').innerHTML = headerHtml;
                
                // Initialize navigation
                initComponents();
                
                // Load markdown content if available
                const contentPath = document.body.getAttribute('data-markdown-content');
                if (contentPath) {
                    const contentResponse = await fetch(contentPath);
                    const markdown = await contentResponse.text();
                    
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        headerIds: true,
                        mangle: false
                    });
                    
                    const contentElement = document.getElementById('content');
                    contentElement.innerHTML = marked.parse(markdown);
                }
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Initialize everything when the DOM is ready
        document.addEventListener('DOMContentLoaded', loadComponents);
    </script>
</body>
</html>
