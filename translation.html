<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://filament-testing.codexfit.com/autoconfigure.js"></script>
    <link href="./styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/demo.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/codexSettings.js"></script>

    <script>
        // Check URL and set locale accordingly
        const currentUrl = window.location.pathname;
        let locale;
        
        if (currentUrl.includes('/en/')) {
            locale = 'en-GB';
        } else if (currentUrl.includes('/fr/')) {
            locale = 'fr-BE';
        } else {
            locale = 'nl-BE'; // Flemish
        }
        
        Codex().set('locale', locale);
    </script>

</head>
<body>
    <!-- Header container -->
    <div id="header"></div>

    <!-- Content container with data-markdown attribute -->
    <div id="content" class="markdown-body" data-markdown="./content/translation.md">  
        <!-- Content will be loaded here -->
    </div>

    <script src="./js/loadComponents.js"></script>
    <script>
        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initComponents();
            await loadMarkdownContent();
        });
    </script>
</body>
</html>
