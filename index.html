<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://cyclo.codexfit.com/autoconfigure.js"></script>
    <link href="./styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/demo.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/codexSettings.js"></script>

</head>
<body>
    <!-- Header container -->
    <div id="header"></div>

    <!-- Content container with data-markdown attribute -->
    <div id="content" class="markdown-body" data-markdown="./content/index.md">  
        <!-- Content will be loaded here -->
    </div>

    <div data-codex>

        <div class="_c-grid">
            <codex-tab-wrapper class-name="_c-two-up _c-row">
                <codex-available-credits targetPath="credits"></codex-available-credits>
                <codex-bookings-completed></codex-bookings-completed>
            </codex-tab-wrapper>
        
            <codex-tab-wrapper class-name="_c-two-up">
                <codex-subscriptions-overview></codex-subscriptions-overview>
            </codex-tab-wrapper>
        </div>

        <codex-tab-container
            :useRouter="true"
            :disableRouting="true"
            layout="vertical"
            :fullScreen="false"
            :tabs="[
                {
                    id: 'booked',
                    label: 'Booked',
                    component: 'codex-component',
                    props: {
                        group: 'booking',
                        fixedValues: {
                            type: 'upcoming'
                        },
                        defaultValues: {
                            limit: 10,
                            page: 1
                        },
                        hasContext: true,
                        type: 'codex-bookings',
                        enableBorder: true
                    }
                },
                {
                    id: 'waitlist',
                    label: 'Waitlist',
                    component: 'codex-component',
                    props: {
                        group: 'waitlist',
                        fixedValues: {
                            type: 'upcoming'
                        },
                        defaultValues: {
                            limit: 10,
                            page: 1
                        },
                        hasContext: true,
                        type: 'codex-waitlists',
                        enableBorder: true
                    }
                }
            ]"
        >
        </codex-tab-container>
    </div>

    <script src="./js/loadComponents.js"></script>
    <script>
        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initComponents();
            await loadMarkdownContent();
        });
    </script>
</body>
</html>
