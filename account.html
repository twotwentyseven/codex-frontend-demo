<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://cyclo.codexfit.com/autoconfigure.js"></script>
    <link href="./styles/css-variables.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/client-styles.css" rel="stylesheet" type="text/css"/>
    <link href="./styles/demo.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/codexSettings.js"></script>
    
</head>
  <body>
    <div id="header"></div>

    <div id="content" class="markdown-body" data-markdown="./content/account.md">
      <!-- Page specific content will be here -->
    </div>

    <div 
        data-codex 
        data-codex-router="true"
        data-codex-router-mode="hash"
        data-codex-router-base="/" 
        data-codex-router-routes='[
            {
                "path": "/", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountOverview"
                },
                "meta": {
                    "label": "@:account.overview", 
                    "icon": "ri-home-4-line"
                }
            },
            {
                "path": "/credits", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountCredits"
                },
                "meta": {
                    "label": "@:account.credits", 
                    "icon": "ri-money-pound-circle-line"
                }
            },
            {
                "path": "/memberships", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountMembership"
                },
                "meta": {
                    "label": "@:account.memberships", 
                    "icon": "ri-ticket-2-line"
                }
            },
            {
                "path": "/favourite", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountFavourites"
                },
                "meta": {
                    "label": "@:account.favourites", 
                    "icon": "ri-heart-line"
                }
            },
            {
                "path": "/history", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountHistory"
                },
                "meta": {
                    "label": "@:account.class_history", 
                    "icon": "ri-motorbike-line"
                }
            },
            {
                "path": "/transactions", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountTransactions"
                },
                "meta": {
                    "label": "@:account.transactions", 
                    "icon": "ri-bank-card-line"
                }
            },
            {
                "path": "/details", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountDetails"
                },
                "meta": {
                    "label": "@:account.details", 
                    "icon": "ri-user-line"
                }
            },
            {
                "path": "/notifications", 
                "component": "codex-tab-content",
                "props": {
                    "preset": "accountNotifications"
                },
                "meta": {
                    "label": "@:account.notifications", 
                    "icon": "ri-notification-line",
                    "labelComponent": "codex-notification-summary"
                }
            },
            {
                "path": "/logout",
                "component": "codex-tab-content",
                "meta": {
                    "label": "@:account.logout",
                    "icon": "ri-logout-box-line",
                    "replaceTab": true,
                    "labelComponent": "codex-logout",
                    "labelProps": { 
                        "isSimple": true
                    }
                }
            }
        ]'
    >
        
        <codex-tab-container :show-customers-only="true" layout="horizontal" :full-screen="true"></codex-tab-container>
        

        <codex-popup-trigger v-if="customer" modal-name="codex-referral" x-position="left" y-position="bottom" modal-x-position="center" modal-y-position="center" variant="primary" default-text="Refer a friend">
            <template #before>
                <i class="ri-share-line"></i> 
            </template>
            <template #default>
                <codex-referral></codex-referral>
            </template>
        </codex-popup-trigger>
    </div>


    <script src="./js/loadComponents.js"></script>
    <script>
        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initComponents();
            await loadMarkdownContent();
        });
    </script>
  </body>
</html>
