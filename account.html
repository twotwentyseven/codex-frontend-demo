<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODEXFit Frontend Library v4</title>
    <script src="https://filament-staging.codexfit.com/autoconfigure.js"></script>
    <link href="/styles/css-variables.css" rel="stylesheet" type="text/css" />
    <link href="/styles/demo.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/codexSettings.js"></script>
    
</head>
  <body>
    <div id="header-container"></div>

    <div id="content" class="markdown-body" data-markdown-content="/content/...">
      <!-- Page specific content will be here -->
    </div>

    <div
      data-codex
      data-codex-router="true"
      data-codex-router-mode="hash"
      data-codex-router-base="/"
      data-codex-router-routes='[
        {
            "path": "/", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountOverview"
            },
            "meta": {
                "label": "@:account.overview", 
                "icon": "ri-home-4-line"
            }
        },
        {
            "path": "/credits", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountCredits"
            },
            "meta": {
                "label": "Credits", 
                "icon": "ri-money-pound-circle-line"
            }
        },
        {
            "path": "/memberships", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountMembership"
            },
            "meta": {
                "label": "Memberships", 
                "icon": "ri-ticket-2-line"
            }
        },
        {
            "path": "/favourite", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountFavourites"
            },
            "meta": {
                "label": "Favourties", 
                "icon": "ri-heart-2-line"
            }
        },
        {
            "path": "/history", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountHistory"
            },
            "meta": {
                "label": "Class History", 
                "icon": "ri-motorbike-line"
            }
        },
        {
            "path": "/transactions", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountTransactions"
            },
            "meta": {
                "label": "Transactions", 
                "icon": "ri-bank-card-line"
            }
        },
        {
            "path": "/details", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountDetails"
            },
            "meta": {
                "label": "Details", 
                "icon": "ri-user-line"
            }
        },
        {
            "path": "/notifications", 
            "component": "codex-tab-content",
            "props": {
                "preset": "accountNotifications"
            },
            "meta": {
                "label": "Notifications", 
                "icon": "ri-notification-line",
                "labelComponent": "codex-notification-summary"
            }
        },
        {
            "path": "/logout",
            "component": "codex-tab-content",
            "meta": {
                "label": "Logout",
                "icon": "ri-logout-box-line",
                "replaceTab": true,
                "labelComponent": "codex-logout",
                "labelProps": { 
                    "isSimple": true
                }
            }
        }
    ]'>
      <codex-tab-container layout="row" :full-screen="true"></codex-tab-container>
    </div>

    <script type="module">
      import { initComponents } from "/js/loadComponents.js";

      // Function to load components
      async function loadComponents() {
        try {
          // Load header
          const headerResponse = await fetch("/components/header.html");
          const headerHtml = await headerResponse.text();
          document.getElementById("header-container").innerHTML = headerHtml;

          // Initialize navigation
          initComponents();

          // Load markdown content if available
          const contentPath = document.body.getAttribute("data-markdown-content");
          if (contentPath) {
            const contentResponse = await fetch(contentPath);
            const markdown = await contentResponse.text();

            marked.setOptions({
              breaks: true,
              gfm: true,
              headerIds: true,
              mangle: false,
            });

            const contentElement = document.getElementById("content");
            contentElement.innerHTML = marked.parse(markdown);
          }
        } catch (error) {
          console.error("Error loading components:", error);
        }
      }

      // Initialize everything when the DOM is ready
      document.addEventListener("DOMContentLoaded", loadComponents);
    </script>
  </body>
</html>
